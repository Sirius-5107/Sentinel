# Sentinel — Application Configuration
# All secrets must be supplied via environment variables or .env.
# Never commit real credentials to this file.

app:
  name: sentinel
  env: development        # development | staging | production
  debug: false
  log_level: INFO

database:
  host: "${SENTINEL_DB_HOST}"
  port: 5432
  name: "${SENTINEL_DB_NAME}"
  user: "${SENTINEL_DB_USER}"
  password: "${SENTINEL_DB_PASSWORD}"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: false           # enable only in development

scheduler:
  timezone: "UTC"
  max_concurrent_jobs: 4

http:
  timeout: 30             # seconds
  max_retries: 3
  backoff_factor: 0.5
