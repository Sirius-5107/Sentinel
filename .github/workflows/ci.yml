name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Type-check · Test · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          # Cache the uv cache directory keyed on the lockfile so cache
          # is invalidated automatically whenever dependencies change.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        # uv manages the Python installation; we pin the version here so
        # the runner environment matches the project's requires-python.
        run: uv python install 3.13

      - name: Verify lockfile is up-to-date
        # Fails if pyproject.toml has been edited without running `uv lock`.
        # This catches the "forgot to re-lock" mistake before any code runs.
        run: uv lock --check

      - name: Install dependencies
        # --locked: install exactly what is in uv.lock — no re-resolution.
        # Fails loudly if the lockfile is absent or stale (belt + suspenders
        # with the step above).
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format check
        run: uv run --frozen ruff format --check .

      - name: Pyright
        run: uv run --frozen pyright

      - name: Pytest
        run: uv run --frozen pytest

      - name: Build MkDocs
        run: uv run --frozen mkdocs build --strict
